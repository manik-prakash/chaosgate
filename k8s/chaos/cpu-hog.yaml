# Reference only: see pod-delete.yaml.
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: chaos-gate-pod-cpu-hog-exec-example
  namespace: default
spec:
  engineState: active
  annotationCheck: "false"
  appinfo:
    appns: default
    applabel: app=backend
    appkind: rollout
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-cpu-hog-exec
      spec:
        components:
          env:
            - {name: TOTAL_CHAOS_DURATION, value: "60"}
            - {name: CPU_CORES, value: "2"}
