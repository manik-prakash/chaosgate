# Least privilege: everything is namespaced to the namespace the orchestrator works in (NAMESPACE=default).
# If you change NAMESPACE / CHAOS_APP_NAMESPACE, move the Role and RoleBinding there too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-gate-orchestrator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-gate-orchestrator
  namespace: default
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosresults"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # dashboard rollback: read the stable ReplicaSet's image
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-gate-orchestrator
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-gate-orchestrator
subjects:
  - kind: ServiceAccount
    name: chaos-gate-orchestrator
    namespace: default
---
# The only cluster-wide permission: checking at startup that the Argo and Litmus CRDs are installed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-gate-crd-check
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["rollouts.argoproj.io", "chaosengines.litmuschaos.io", "chaosresults.litmuschaos.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-gate-crd-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chaos-gate-crd-check
subjects:
  - kind: ServiceAccount
    name: chaos-gate-orchestrator
    namespace: default
