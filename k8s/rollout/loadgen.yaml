# Steady traffic so the SLO metric always has data (reuses the demo-backend image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      containers:
        - name: loadgen
          image: demo-backend:v1
          imagePullPolicy: IfNotPresent
          command: ["python", "loadgen.py"]
          env:
            - {name: RPS, value: "20"}
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {memory: 96Mi}
